{% extends "base.html" %}{% block title %}Register - {{ site }}{% endblock %}
{% block body %}<div class="panel narrow"><h1>Create account</h1><p class="sub">Step 1 of 2. You pay the KSh {{ fee }} access fee next.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label>Full name<input name="name" required maxlength="60" autocomplete="name"></label>
<label>Phone (07xx or 01xx)<input name="phone" type="tel" required maxlength="16" autocomplete="tel"></label>
<label>Email (optional)<input name="email" type="email" maxlength="120" autocomplete="email"></label>
<label>Password (8+ characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
<button class="btn" style="width:100%">Create account</button></form>
<p class="fine">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
