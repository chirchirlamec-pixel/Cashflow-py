{% extends "base.html" %}{% block title %}Admin sign in - {{ site }}{% endblock %}
{% block body %}<div class="panel narrow"><h1>Admin sign in</h1>
{% if not configured %}<div class="flash err">ADMIN_PASSWORD_HASH is not set on the server, so sign-in is disabled. See the README.</div>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label>Email<input name="email" type="email" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button class="btn" style="width:100%">Sign in</button></form></div>{% endblock %}
