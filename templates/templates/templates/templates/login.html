{% extends "base.html" %}{% block title %}Sign in - {{ site }}{% endblock %}
{% block body %}<div class="panel narrow"><h1>Sign in</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label>Phone<input name="phone" type="tel" required autocomplete="username"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<button class="btn" style="width:100%">Sign in</button></form>
<p class="fine">New here? <a href="{{ url_for('register') }}">Register</a></p></div>{% endblock %}
